<style>
  #hi-version-badge {
    position: fixed;
    top: 12px;
    right: 18px;
    z-index: 1000;
    background: #ffffff;
    border: 1px solid #00AA5B;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  }
  #hi-version-badge a {
    color: #00AA5B;
    font-weight: 600;
    text-decoration: none;
  }
  #hi-version-badge a:hover {
    text-decoration: underline;
  }
</style>

<script>
  // Make every external link (http/https) open in a new tab.
  // Internal navigation (relative anchors and same-domain chapter links) is unaffected.
  document.addEventListener('DOMContentLoaded', function() {
    var host = window.location.host;
    document.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(function(a) {
      var url;
      try { url = new URL(a.href); } catch (e) { return; }
      if (url.host && url.host !== host) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
  });
</script>

<script>
  // Dark mode. Default: follow the computer's light/dark setting.
  // The sun/moon button in the toolbar switches dark <-> light and remembers the choice.
  // It uses gitbook's own Night theme (class "color-theme-2" on .book).
  (function() {
    var KEY = 'hi-v2-color-mode';            // "dark" | "light"; not set = follow the computer
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function isDark() {
      var s = saved();
      if (s === 'dark') return true;
      if (s === 'light') return false;
      return !!(mq && mq.matches);
    }

    // Keep gitbook's own font-settings theme in step, so its next page load agrees with ours.
    function syncGitbook(dark) {
      var gb = window.gitbook;
      if (!gb || !gb.storage) return;
      var st = gb.storage.get('fontState', null);
      if (!st) return;
      var theme = dark ? 2 : (st.theme === 1 ? 1 : 0);
      if (st.theme !== theme) { st.theme = theme; gb.storage.set('fontState', st); }
    }

    function apply() {
      var dark = isDark();
      document.documentElement.classList.toggle('hi-dark', dark);
      var book = document.querySelector('.book');
      if (book) {
        if (dark) { book.classList.remove('color-theme-1'); book.classList.add('color-theme-2'); }
        else { book.classList.remove('color-theme-2'); }
      }
      syncGitbook(dark);
      // bookdown paints the fixed toolbar with the page colour it saw at load time (white);
      // repaint it with the current page colour so it matches dark, light and sepia.
      var hdr = document.querySelector('.book-header.fixed');
      var bb = document.querySelector('.book-body');
      if (hdr && bb) hdr.style.backgroundColor = getComputedStyle(bb).backgroundColor;
      var btn = document.querySelector('.hi-dark-toggle');
      if (btn) {
        var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
        var icon = btn.querySelector('i');
        if (icon) icon.className = dark ? 'fa fa-sun-o' : 'fa fa-moon-o';
      }
    }

    // Set the page colour before the body is drawn, to avoid a white flash.
    if (isDark()) document.documentElement.classList.add('hi-dark');

    document.addEventListener('DOMContentLoaded', apply);

    window.addEventListener('load', function() {
      var gb = window.gitbook;
      if (gb && gb.toolbar && !document.querySelector('.hi-dark-toggle')) {
        gb.toolbar.createButton({
          icon: 'fa fa-moon-o',
          label: 'Dark mode',
          className: 'hi-dark-toggle',
          position: 'left',
          onClick: function(e) {
            e.preventDefault();
            save(isDark() ? 'light' : 'dark');
            apply();
          }
        });
      }
      if (gb && gb.events) gb.events.bind('page.change', apply);
      apply();
    });

    // Follow the computer while the reader has not picked a mode.
    if (mq) {
      var onChange = function() { if (!saved()) apply(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }

    // gitbook's own font menu (White / Sepia / Night) counts as a choice too.
    document.addEventListener('click', function(e) {
      var b = e.target.closest && e.target.closest('.font-settings .dropdown-menu .button');
      if (!b) return;
      var t = (b.textContent || '').trim();
      if (t === 'Night') save('dark');
      else if (t === 'White' || t === 'Sepia') save('light');
      else return;
      setTimeout(apply, 0);
    });
  })();
</script>

<style>
  /* Dark mode: page colour before gitbook draws (no white flash) */
  html.hi-dark, html.hi-dark body { background: #1c1f2b; }

  /* Dark mode: our own elements */
  html.hi-dark #hi-version-badge {
    background: #2d3143;
    border-color: #3ddc97;
    box-shadow: 0 1px 4px rgba(0,0,0,0.40);
  }
  html.hi-dark #hi-version-badge a { color: #3ddc97; }
  .book.color-theme-2 p.caption,
  .book.color-theme-2 figcaption { color: #9aa5b8 !important; }
  .book.color-theme-2 span[style*="color: blue"] { color: #7fb2ff !important; }
  .book.color-theme-2 span[style*="#b00020"] { color: #ff7a8a !important; }
  .book.color-theme-2 .book-header,
  .book.color-theme-2 .book-header .btn { color: #bcc1d2; }
  .book.color-theme-2 .book-header.fixed { background-color: #1c1f2b !important; border-bottom-color: #373b4e; }
</style>
